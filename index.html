<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarga y Ejecución Local Forzada</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0a0a0c;
            color: #00ff66;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #11141a;
            padding: 25px;
            border: 2px dashed #00ff66;
            border-radius: 8px;
            text-align: center;
        }
        input {
            width: 75%;
            padding: 12px;
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            margin-bottom: 15px;
            font-family: monospace;
        }
        button {
            padding: 12px 25px;
            background: #00ff66;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover { background: #00cc55; }
        .log {
            margin-top: 20px;
            padding: 10px;
            background: #000;
            border: 1px solid #333;
            font-size: 13px;
            color: #00ffff;
            text-align: left;
            min-height: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>[ SISTEMA DE EXTRACCIÓN CRUDA ]</h2>
    <p>Si el firewall bloquea el streaming, cambiaremos la estrategia a descarga directa forzada en buffer binario.</p>
    
    <input type="text" id="videoUrl" placeholder="Pega el enlace de YouTube aquí...">
    <button onclick="forzarDescargaLocal()">EXTRAER Y FORZAR</button>
    
    <div class="log" id="consoleLog">> Esperando instrucción...</div>
</div>

<script>
async function forzarDescargaLocal() {
    const url = document.getElementById('videoUrl').value;
    const log = document.getElementById('consoleLog');
    
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    const id = (match && match[2].length === 11) ? match[2] : null;

    if (!id) {
        log.innerText = "> [ERROR] Enlace de YouTube inválido.";
        return;
    }

    log.innerText = "> [1/2] Solicitando empaquetado de archivo a servidor remoto neutro...";

    try {
        // Petición directa a la API de Cobalt para generar un enlace de descarga directa (.mp4 público)
        const response = await fetch('https://api.cobalt.tools/api/json', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
                url: `https://www.youtube.com/watch?v=${id}`,
                videoQuality: '480', // Calidad balanceada para bypass rápido
                isNoTTWatermark: true
            })
        });

        const data = await response.json();

        if (data && data.url) {
            log.innerText = "> [2/2] ¡Enlace limpio generado! Forzando descarga en el navegador...";
            
            // Creamos un trigger de descarga nativo para bajar el archivo directo a la máquina
            const a = document.createElement('a');
            a.href = data.url;
            a.download = `video_${id}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            log.innerHTML = `> [ÉXITO] Archivo enviado al navegador. Abre tu carpeta de descargas y reproduce el archivo <b>video_${id}.mp4</b> directamente.`;
        } else {
            throw new Error();
        }
    } catch (err) {
        log.innerText = "> [FALLO] Fortinet bloqueó las llamadas de red externas de la API. Aplicando redirección de contingencia...";
        // Intento final: abrir el generador crudo en una pestaña externa desvinculada
        window.open(`https://pub-p764.savetube.me/download/video/${id}`, '_blank');
    }
}
</script>

</body>
</html>
