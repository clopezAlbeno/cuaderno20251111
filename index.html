<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass Absoluto v4</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0b0b;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-box {
            width: 100%;
            max-width: 800px;
            background: #161616;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            border: 1px solid #262626;
            text-align: center;
        }
        h2 { color: #00ffcc; margin-top: 0; font-weight: 400; }
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 14px;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #00ffcc; }
        button {
            padding: 14px 28px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover { background: #00ccaa; }
        .frame-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            border: 1px solid #333;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .alert-text {
            margin-top: 15px;
            font-size: 13px;
            color: #ff5555;
            background: rgba(255,85,85,0.1);
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="main-box">
    <h2>Evasión de Certificado IP Extrema</h2>
    <div class="input-area">
        <input type="text" id="targetUrl" placeholder="Pega el enlace de YouTube aquí...">
        <button onclick="ejecutarBypassMaximo()">Forzar Ejecución</button>
    </div>
    
    <div class="frame-wrapper" id="wrapper">
        <iframe id="bypassPlayer" sandbox="allow-scripts allow-same-origin allow-presentation" allowfullscreen></iframe>
    </div>

    <div class="alert-text" id="errorAlert">
        Si el video no carga, tu red bloquea las conexiones SSL externas a nivel de hardware. Revisa las alternativas abajo.
    </div>
</div>

<script>
function getID(url) {
    const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(reg);
    return (match && match[2].length === 11) ? match[2] : null;
}

function ejecutarBypassMaximo() {
    const url = document.getElementById('targetUrl').value;
    const id = getID(url);
    const wrapper = document.getElementById('wrapper');
    const player = document.getElementById('bypassPlayer');
    const alertBox = document.getElementById('errorAlert');

    if (!id) {
        alert("Introduce un enlace de YouTube válido.");
        return;
    }

    alertBox.style.display = "block";
    wrapper.style.display = "block";

    // Usamos una pasarela de reproductor embebido que disfraza el tráfico usando un visor alternativo
    // Cambiamos radicalmente el origen del servidor a uno de distribución académica/privada
    player.src = `https://piped.mha.fi/embed/${id}`;
}
</script>

</body>
</html>
