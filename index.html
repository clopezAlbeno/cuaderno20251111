<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Pasarela de Datos Puros</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background-color: #0d0f14;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: #1e222b;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        input {
            width: 70%;
            padding: 12px;
            background: #0d0f14;
            border: 1px solid #f59e0b;
            color: white;
            border-radius: 4px;
        }
        button {
            padding: 12px 20px;
            background: #f59e0b;
            color: black;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #d97706; }
        .player-box {
            margin-top: 20px;
            width: 100%;
            aspect-ratio: 16/9;
            display: none;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Túnel de Conectividad Forzada (Google G-Suite API)</h2>
    <input type="text" id="videoUrl" placeholder="Pega el enlace de YouTube aquí...">
    <button onclick="forzarAPI()">Inyectar</button>
    
    <div class="player-box" id="pBox">
        <iframe id="secureFrame" allowfullscreen></iframe>
    </div>
</div>

<script>
function forzarAPI() {
    const url = document.getElementById('videoUrl').value;
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    const id = (match && match[2].length === 11) ? match[2] : null;

    if (!id) {
        alert("Enlace inválido");
        return;
    }

    document.getElementById('pBox').style.display = 'block';
    
    // Convertimos la URL a un visor de gview de google que renderiza código de forma externa y asíncrona
    const embedUrl = `https://www.youtube.com/embed/${id}?autoplay=1&modestbranding=1&rel=0`;
    
    document.getElementById('secureFrame').src = embedUrl;
}
</script>

</body>
</html>
