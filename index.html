<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reproductor de Video</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #141414;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff0000;
        }
        .search-container {
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background-color: #333;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        button:hover {
            background-color: #cc0000;
        }
        .video-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .instructions {
            color: #aaa;
            font-size: 14px;
            text-align: center;
            max-width: 500px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>StreamPlayer</h1>
    
    <div class="search-container">
        <input type="text" id="videoUrl" placeholder="Pega el enlace de YouTube aquí... (Ej: https://www.youtube.com/watch?v=dQw4w9WgXcQ)">
        <button onclick="loadVideo()">Reproducir</button>
    </div>

    <div class="video-container" id="playerContainer">
        <iframe id="videoPlayer" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <div class="instructions" id="instructions">
        <p>Debido a las restricciones de tu red (Fortinet), no puedes entrar a la interfaz de YouTube. Copia el enlace de un video desde tu celular o búscalo en Google, pégalo aquí arriba y presiona "Reproducir".</p>
    </div>

    <script>
        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadVideo() {
            const urlInput = document.getElementById('videoUrl').value;
            const videoId = extractVideoId(urlInput);
            
            const playerContainer = document.getElementById('playerContainer');
            const videoPlayer = document.getElementById('videoPlayer');
            const instructions = document.getElementById('instructions');

            if (videoId) {
                // Usamos el dominio "youtube-nocookie" que suele saltarse varios bloqueos de firewall empresariales
                videoPlayer.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
                playerContainer.style.display = 'block';
                instructions.style.display = 'none';
            } else {
                alert('Por favor, introduce un enlace de YouTube válido.');
            }
        }
    </script>
</body>
</html>
