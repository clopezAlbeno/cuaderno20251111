<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass de Privacidad</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
        .box { max-width: 700px; margin: auto; background: #222; padding: 20px; border-radius: 8px; }
        input { width: 70%; padding: 10px; margin-right: 10px; border: none; border-radius: 4px; }
        button { padding: 10px 20px; background: #00ff66; border: none; color: #000; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .video-container { margin-top: 20px; aspect-ratio: 16/9; display: none; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
<div class="box">
    <h3>Túnel de Privacidad DuckDuckGo</h3>
    <input type="text" id="urlInput" placeholder="Enlace de YouTube...">
    <button onclick="cargarVideo()">Cargar</button>
    <div class="video-container" id="container">
        <iframe id="player" allowfullscreen></iframe>
    </div>
</div>
<script>
function cargarVideo() {
    const url = document.getElementById('urlInput').value;
    const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(reg);
    const id = (match && match[2].length === 11) ? match[2] : null;
    
    if(id) {
        document.getElementById('container').style.display = 'block';
        // Este endpoint disfraza el tráfico simulando que estás buscando en DuckDuckGo
        document.getElementById('player').src = `https://html.duckduckgo.com/iu/?u=https://www.youtube.com/embed/${id}`;
    } else {
        alert("Enlace no válido");
    }
}
</script>
</body>
</html>
