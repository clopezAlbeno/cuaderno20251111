<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPlayer - Antibaipás</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff4444;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .controls {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #1f1f1f;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 4px;
            background-color: #2b2b2b;
            color: white;
            font-size: 15px;
        }
        select {
            padding: 12px;
            background: #2b2b2b;
            color: white;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
        }
        button {
            padding: 12px 25px;
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #cc2222;
        }
        .video-container {
            width: 100%;
            max-width: 850px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: none;
            border: 1px solid #333;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>StreamPlayer Pro</h1>
    <div class="subtitle">Bypassing Firewalls (Invidious / Piped / Cobalt)</div>
    
    <div class="controls">
        <div class="row">
            <input type="text" id="videoUrl" placeholder="Pega el enlace de YouTube aquí...">
        </div>
        <div class="row">
            <select id="bypassMethod">
                <option value="invidious_1">Método 1: Servidor Proxy Invidious (Recomendado)</option>
                <option value="invidious_2">Método 2: Servidor Alternativo (Yewtu.be)</option>
                <option value="piped">Método 3: Servidor Piped (Privado)</option>
            </select>
            <button onclick="loadBypassVideo()">Desbloquear y Ver</button>
        </div>
    </div>

    <div class="video-container" id="playerContainer">
        <iframe id="videoPlayer" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <script>
        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadBypassVideo() {
            const urlInput = document.getElementById('videoUrl').value;
            const method = document.getElementById('bypassMethod').value;
            const videoId = extractVideoId(urlInput);
            
            const playerContainer = document.getElementById('playerContainer');
            const videoPlayer = document.getElementById('videoPlayer');

            if (!videoId) {
                alert('Por favor, introduce un enlace válido de YouTube.');
                return;
            }

            let embedUrl = "";

            // Diferentes proxies que el firewall no tiene en su lista negra de YouTube
            if (method === "invidious_1") {
                embedUrl = `https://invidious.perennialte.ch/embed/${videoId}?autoplay=1`;
            } else if (method === "invidious_2") {
                embedUrl = `https://yewtu.be/embed/${videoId}?autoplay=1`;
            } else if (method === "piped") {
                embedUrl = `https://piped.video/embed/${videoId}`;
            }

            // Forzar la carga en el iframe limpiando el tráfico hacia Google
            videoPlayer.src = embedUrl;
            playerContainer.style.display = 'block';
        }
    </script>
</body>
</html>
