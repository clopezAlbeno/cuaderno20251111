<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Evasión por Encapsulado Total</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background-color: #0d0f12;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #1a1d24;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        input {
            width: 70%;
            padding: 12px;
            background: #0d0f12;
            border: 1px solid #10b981;
            color: white;
            border-radius: 4px;
        }
        button {
            padding: 12px 20px;
            background: #10b981;
            color: black;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #059669; }
        .player-box {
            margin-top: 20px;
            width: 100%;
            aspect-ratio: 16/9;
            display: none;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Túnel por Enrutador de Red Obscuro</h2>
    <input type="text" id="videoUrl" placeholder="Pega el enlace de YouTube aquí...">
    <button onclick="forzarCargaAbsoluta()">Inyectar Tunnel</button>
    
    <div class="player-box" id="pBox">
        <iframe id="secureFrame" allowfullscreen></iframe>
    </div>
</div>

<script>
function forzarCargaAbsoluta() {
    const url = document.getElementById('videoUrl').value;
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    const id = (match && match[2].length === 11) ? match[2] : null;

    if (!id) {
        alert("Enlace inválido");
        return;
    }

    document.getElementById('pBox').style.display = 'block';
    
    // El truco definitivo: pasar el visor embebido de youtube a través de un cgi-proxy anonimizador tradicional de texto plano.
    // Esto hace que para Fortinet el tráfico parezca navegación HTML pura de un servidor web plano y viejo de Alemania/EEUU.
    const proxyUrl = "https://anonymouse.org/cgi-bin/anon-www.cgi/https://www.youtube.com/embed/" + id;
    
    document.getElementById('secureFrame').src = proxyUrl;
}
</script>

</body>
</html>
