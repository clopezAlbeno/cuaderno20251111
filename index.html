<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass de Red Forzado</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background-color: #0d0f12;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: #1a1d24;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        input {
            width: 70%;
            padding: 12px;
            background: #0d0f12;
            border: 1px solid #3b82f6;
            color: white;
            border-radius: 4px;
        }
        button {
            padding: 12px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #2563eb; }
        .player-box {
            margin-top: 20px;
            width: 100%;
            aspect-ratio: 16/9;
            display: none;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Extractor de Flujo Aislado</h2>
    <input type="text" id="videoUrl" placeholder="Pega el enlace de YouTube aquí...">
    <button onclick="renderVideo()">Cargar Canales</button>
    
    <div class="player-box" id="pBox">
        <iframe id="secureFrame" sandbox="allow-scripts allow-same-origin allow-forms" allowfullscreen></iframe>
    </div>
</div>

<script>
function renderVideo() {
    const url = document.getElementById('videoUrl').value;
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    const id = (match && match[2].length === 11) ? match[2] : null;

    if (!id) {
        alert("Enlace inválido");
        return;
    }

    document.getElementById('pBox').style.display = 'block';
    
    // Forzamos el endpoint embebido puro de Google que a menudo las excepciones de firewall corporativas dejan pasar para Teams/Zoom
    document.getElementById('secureFrame').src = `https://www.youtube.com/embed/${id}?rel=0&modestbranding=1`;
}
</script>

</body>
</html>
