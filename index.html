<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass Absoluto YouTube</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0a0a0a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #111;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            border: 1px solid #222;
        }
        h2 { color: #ff3333; margin-top: 0; text-align: center; }
        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            background: #222;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
            font-size: 15px;
        }
        button {
            padding: 12px 24px;
            background: #ff3333;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #cc2222; }
        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 6px;
            display: none;
            margin-top: 15px;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ultra Bypass Player</h2>
    <div class="input-box">
        <input type="text" id="ytUrl" placeholder="Pega el enlace de YouTube aquí...">
        <button onclick="fuerzaBrutaBypass()">Cargar Video</button>
    </div>
    
    <div class="status" id="statusLabel">Listo para procesar tráfico oculto...</div>
    
    <video id="nativePlayer" controls autoplay></video>
</div>

<script>
async function fuerzaBrutaBypass() {
    const url = document.getElementById('ytUrl').value;
    const statusLabel = document.getElementById('statusLabel');
    const player = document.getElementById('nativePlayer');
    
    // Extractor de ID
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    const videoId = (match && match[2].length === 11) ? match[2] : null;

    if (!videoId) {
        alert("Enlace no válido");
        return;
    }

    statusLabel.innerText = "Evadiendo firewall e interceptando flujos de datos...";
    player.style.display = 'none';

    // Lista de APIs públicas que extraen el archivo de video plano (.mp4) de YouTube desde servidores limpios
    const apiEndpoints = [
        `https://api.cobalt.tools/api/json`,
        `https://co.wuk.sh/api/json`
    ];

    let videoStreamUrl = null;

    // Intentamos extraer el stream nativo simulando una petición de backend
    for (let api of apiEndpoints) {
        try {
            const response = await fetch(api, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    url: `https://www.youtube.com/watch?v=${videoId}`,
                    videoQuality: '720', 
                    audioFormat: 'mp3',
                    isAudioOnly: false
                })
            });

            const data = await response.json();
            if (data && data.url) {
                videoStreamUrl = data.url;
                break;
            }
        } catch (e) {
            console.log("Intentando bypass alternativo...");
        }
    }

    if (videoStreamUrl) {
        statusLabel.innerText = "¡Conexión establecida con éxito! Reproduciendo...";
        player.src = videoStreamUrl;
        player.style.display = 'block';
    } else {
        // Plan C: Si las APIs principales fallan, forzamos un proxy open-source crudo
        statusLabel.innerText = "Aplicando enrutamiento secundario...";
        try {
            const fallbackUrl = `https://invidious.asir.dev/latest_version?id=${videoId}&itag=22`;
            player.src = fallbackUrl;
            player.style.display = 'block';
            statusLabel.innerText = "Reproduciendo vía túnel asíncrono.";
        } catch(err) {
            statusLabel.innerText = "Error crítico: El Firewall bloquea las peticiones de datos HTTP salientes.";
            alert("El firewall es demasiado estricto. Si esto falla, la única opción es usar una VPN en el navegador (como Opera) o usar Web Proxies externos como 'CroxyProxy'.");
        }
    }
}
</script>

</body>
</html>
